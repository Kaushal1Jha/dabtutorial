# This is a Declarative Automation Bundle definition for dabtutorial.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: dabtutorial
  uuid: e556ab0d-2e83-42f8-a0b7-a7acfa289419

include:
  - resources/*.yml
  - resources/*/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-b86400a5-09e4.cloud.databricks.com
    variables:
      catalog: dabtutorial
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-b86400a5-09e4.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/jhak203@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/jhak203@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: dabtutorial
      schema: prod
    permissions:
      - user_name: jhak203@gmail.com
        level: CAN_MANAGE
